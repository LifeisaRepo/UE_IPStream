[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; FFmpeg ships outside the folders the plugin packager copies by default, so list it here.
; Only what the plugin needs: headers and import libraries to compile and link it,
; the five DLLs to run it (swresample because avcodec imports it), and the licence texts.
/ThirdParty/FFmpeg/COPYING.LGPLv3
/ThirdParty/FFmpeg/COPYING.GPLv3
/ThirdParty/FFmpeg/NOTICE.md
/ThirdParty/FFmpeg/include/...
/ThirdParty/FFmpeg/lib/Win64/avutil.lib
/ThirdParty/FFmpeg/lib/Win64/avcodec.lib
/ThirdParty/FFmpeg/lib/Win64/avformat.lib
/ThirdParty/FFmpeg/lib/Win64/swscale.lib
/ThirdParty/FFmpeg/bin/Win64/avutil-61.dll
/ThirdParty/FFmpeg/bin/Win64/avcodec-63.dll
/ThirdParty/FFmpeg/bin/Win64/avformat-63.dll
/ThirdParty/FFmpeg/bin/Win64/swscale-10.dll
/ThirdParty/FFmpeg/bin/Win64/swresample-7.dll
